spring:
  application:
    name: fincore-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore_local}
  flyway:
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:true}
      timeout: 30m

fincore:
  identity:
    # Una instalación debe habilitar el registro de forma consciente.
    registration-enabled: ${REGISTRATION_ENABLED:false}
  transfers:
    # Límite educativo configurable; FinCore no procesa dinero real.
    maximum-amount: ${TRANSFER_MAXIMUM_AMOUNT:100000.00}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: FinCore
    description: Educational financial core simulator
